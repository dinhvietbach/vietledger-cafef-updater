name: Update CafeF and publish VietLedger
on:
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: Republish saved reports, industries and earnings research
        type: boolean
        default: false
  schedule:
    # UTC: equivalent to 00, 09, 12, 15, 18, 21 in Vietnam.
    - cron: '0 2,5,8,11,14,17 * * *'
permissions:
  contents: read
concurrency:
  group: vietledger-cafef-production
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_CAFEF_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      DATA_DIR: /tmp/vietledger-cloud-data
      PUBLIC_SITE_URL: https://vietledger.pages.dev/
      PUBLIC_CLOUD_SCHEDULE: ${{ vars.ENABLE_CAFEF_SCHEDULE }}
      REBUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test data preservation and formulas
        run: node --test analysis.test.mjs market-valuations.test.mjs financial-charts.test.mjs growth.test.mjs industries.test.mjs earnings.test.mjs public-restore.test.mjs public-data.test.mjs ratios.test.mjs report-store.test.mjs cafef-api.test.mjs sectors.test.mjs
      - name: Restore previous data and check CafeF
        run: node --use-system-ca cloud-sync.mjs
      - name: Build and verify all public reports
        run: |
          node build-public.mjs release/public-site
          node verify-public.mjs
      - name: Publish the verified site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.149.0 pages deploy release/public-site --project-name vietledger --branch main
